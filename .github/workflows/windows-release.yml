name: Windows release candidate
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Prepare isolated build environment
        shell: pwsh
        run: python -m venv .venv-build
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - name: Test installation, offline file repair and uninstall
        shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - name: Upload candidate artifacts (does not publish a release)
        uses: actions/upload-artifact@v4
        with:
          name: UnrealPipelineManager-Windows-x64-candidate
          path: release/*
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            build/**/*.txt
            release/*.log
            ~/AppData/Local/UnrealPipelineManager/logs/*
          if-no-files-found: ignore
